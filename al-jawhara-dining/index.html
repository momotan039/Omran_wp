
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Jawhara | Modern Fine Dining</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              brand: {
                black: '#0A0A0A',
                gold: '#D4AF37',
                goldLight: '#F4CF67',
                cream: '#FAF9F6',
                gray: '#71717A',
                accent: '#B8860B'
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FAF9F6;
        color: #0A0A0A;
        overflow-x: hidden;
        cursor: default;
      }
      /* Grain Overlay for Texture */
      .grain::before {
        content: "";
        position: fixed;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background-image: url("https://www.transparenttextures.com/patterns/p6.png");
        opacity: 0.04;
        pointer-events: none;
        z-index: 50;
      }
      .luxury-shadow {
        box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.12);
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      }
      /* Smooth transitions for state-based routing */
      .page-enter { opacity: 0; transform: translateY(10px); }
      .page-enter-active { opacity: 1; transform: translateY(0); transition: all 600ms ease-out; }
      
      /* Hide scrollbar but keep functionality */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="grain">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
